[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csp-sca"
version = "0.1.0"
description = "Class-conditioned Subspace Projection for continual profiled side-channel analysis"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.9,<3",
    "transformers==4.57.6",
    "safetensors>=0.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
csp-sca = "csp_sca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

